# =============================================================================
# Nginx — Proxy reverso para o Apache Superset (Análises GTW-CWB) — DESENVOLVIMENTO
#
# ATENÇÃO: SSO desabilitado e identidade fixa (administrador, grupo 11 = Admin).
# Usado somente pelo docker-compose.yml de desenvolvimento. A produção usa
# nginx/default.conf (com auth_request), montado pelo docker-compose.prod.yml.
#
# O Superset NÃO publica portas. Todo acesso passa por este nginx, que:
#   1. Valida a sessão do GTW via auth_request (SSO)
#   2. Sobrescreve cabeçalhos X-GTW-* (segurança: impede forja pelo cliente)
#   3. Encaminha a requisição ao Superset com os cabeçalhos de identidade
# =============================================================================

upstream superset_upstream {
    server superset:8088;
}

server {
    listen 80;
    server_name _;

    # Tamanho máximo de corpo (uploads de importação de dashboards etc.)
    client_max_body_size 50m;

    # --------------------------------------------------------------------------
    # Sub-requisição de autenticação SSO
    # Chama o endpoint do GTW que valida a sessão e retorna cabeçalhos de
    # identidade. Retorno 2xx = autenticado; 401 = sem sessão.
    #
    # Em DESENVOLVIMENTO: auth_request desabilitado (GTW em porta diferente
    # causa problemas de sessão cross-port). Em PRODUÇÃO: descomentar o bloco.
    # --------------------------------------------------------------------------
    # location = /auth {
    #     internal;
    #     proxy_pass              http://host.docker.internal:8080/MuralhaDigital/SsoAnalise?acao=validar;
    #     proxy_pass_request_body off;
    #     proxy_set_header        Content-Length "";
    #     proxy_set_header        X-Original-URI $request_uri;
    #     proxy_set_header        Cookie $http_cookie;
    # }

    # --------------------------------------------------------------------------
    # Localização principal — proxy para o Superset
    # --------------------------------------------------------------------------
    location / {
        # PRODUÇÃO: descomentar auth_request e auth_request_set abaixo
        # auth_request /auth;
        # auth_request_set $gtw_usuario  $upstream_http_x_gtw_usuario;
        # auth_request_set $gtw_user_id  $upstream_http_x_gtw_userid;
        # auth_request_set $gtw_grupos   $upstream_http_x_gtw_grupos;
        # proxy_set_header X-GTW-Usuario  $gtw_usuario;
        # proxy_set_header X-GTW-UserId   $gtw_user_id;
        # proxy_set_header X-GTW-Grupos   $gtw_grupos;

        # DESENVOLVIMENTO: headers fixos (remover em produção)
        # Grupo 11 = Admin no mapeamento GTW_GRUPOS_PAPEIS
        proxy_set_header X-GTW-Usuario  "administrador";
        proxy_set_header X-GTW-UserId   "1";
        proxy_set_header X-GTW-Grupos   "11";

        # Cabeçalhos padrão de proxy reverso
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://superset_upstream;

        # WebSocket (explorador SQL do Superset pode usar)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }

    # --------------------------------------------------------------------------
    # API do Superset
    # --------------------------------------------------------------------------
    location /api/ {
        # PRODUÇÃO: descomentar auth_request e auth_request_set
        # auth_request /auth;
        # auth_request_set $gtw_usuario  $upstream_http_x_gtw_usuario;
        # auth_request_set $gtw_user_id  $upstream_http_x_gtw_userid;
        # auth_request_set $gtw_grupos   $upstream_http_x_gtw_grupos;
        # proxy_set_header X-GTW-Usuario  $gtw_usuario;
        # proxy_set_header X-GTW-UserId   $gtw_user_id;
        # proxy_set_header X-GTW-Grupos   $gtw_grupos;

        # DESENVOLVIMENTO: headers fixos (remover em produção)
        # Grupo 11 = Admin no mapeamento GTW_GRUPOS_PAPEIS
        proxy_set_header X-GTW-Usuario  "administrador";
        proxy_set_header X-GTW-UserId   "1";
        proxy_set_header X-GTW-Grupos   "11";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://superset_upstream;
    }

    # --------------------------------------------------------------------------
    # Assets estáticos do Superset — sem auth (são públicos: JS, CSS, fontes)
    # --------------------------------------------------------------------------
    location /static/ {
        proxy_pass http://superset_upstream;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # --------------------------------------------------------------------------
    # Health check do nginx (sem autenticação)
    # --------------------------------------------------------------------------
    location /nginx-health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # --------------------------------------------------------------------------
    # Página de erro para sessão expirada — redireciona ao login do GTW
    # --------------------------------------------------------------------------
    error_page 401 = @login_redirect;
    location @login_redirect {
        return 302 $scheme://host.docker.internal:8080/muralha-digital/pages/login/login.jsp?retorno=/analise/;
    }
}
