# =============================================================================
# Docker Compose — Desenvolvimento — Apache Superset (Análises GTW-CWB)
# Uso:  docker compose up -d
# Produção: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Superset — servidor web (Gunicorn)
  # Não publica porta; acessível somente pelo nginx.
  # ---------------------------------------------------------------------------
  superset:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      SUPERSET_CONFIG_PATH: /app/superset_config.py
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - superset_home:/app/superset_home
      # DEV: monta arquivos locais para iteração rápida (sem rebuild)
      - ./superset/gtw_security.py:/app/gtw_security.py:ro
      - ./superset/superset_config.py:/app/superset_config.py:ro
      - ./superset/provisionar.py:/app/provisionar.py:ro
      - ./superset/datasets:/app/datasets:ro
      - ./superset/dashboards:/app/dashboards:ro
      - ./superset/governanca:/app/governanca:ro
      - ./superset/alertas:/app/alertas:ro
      - ./superset/demo:/app/demo:ro
    networks:
      - analise_net
    # Nenhuma porta publicada — só nginx alcança o Superset

  # ---------------------------------------------------------------------------
  # Inicialização — migra o banco e cria o admin; executa uma vez e encerra.
  # ---------------------------------------------------------------------------
  superset-init:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      SUPERSET_CONFIG_PATH: /app/superset_config.py
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    command:
      - bash
      - -c
      - |
        echo '>>> Migrando banco de metadados do Superset...' &&
        superset db upgrade &&
        echo '>>> Criando usuário administrador...' &&
        superset fab create-admin \
          --username "$SUPERSET_ADMIN_USERNAME" \
          --password "$SUPERSET_ADMIN_PASSWORD" \
          --firstname "$SUPERSET_ADMIN_FIRST_NAME" \
          --lastname "$SUPERSET_ADMIN_LAST_NAME" \
          --email "$SUPERSET_ADMIN_EMAIL" || true &&
        echo '>>> Inicializando papéis padrão...' &&
        superset init &&
        echo '>>> Inicialização concluída.'
    volumes:
      - superset_home:/app/superset_home
    networks:
      - analise_net
    restart: "no"

  # ---------------------------------------------------------------------------
  # PostgreSQL — banco de metadados do Superset
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: ${POSTGRES_USER:-superset}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - analise_net

  # ---------------------------------------------------------------------------
  # Redis — cache e broker Celery
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    volumes:
      - redis_data:/data
    networks:
      - analise_net

  # ---------------------------------------------------------------------------
  # Celery Worker — executa alertas e relatórios agendados (SUP-7)
  # ---------------------------------------------------------------------------
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      SUPERSET_CONFIG_PATH: /app/superset_config.py
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    command: ["celery", "--app=superset.tasks.celery_app:app", "worker", "--pool=prefork", "--concurrency=2", "--max-tasks-per-child=128", "-Ofair", "--loglevel=INFO"]
    volumes:
      - superset_home:/app/superset_home
    networks:
      - analise_net

  # ---------------------------------------------------------------------------
  # Celery Beat — agendador de tarefas periódicas (SUP-7)
  # ---------------------------------------------------------------------------
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      SUPERSET_CONFIG_PATH: /app/superset_config.py
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    command: ["celery", "--app=superset.tasks.celery_app:app", "beat", "--pidfile=", "--schedule=/tmp/celerybeat-schedule", "--loglevel=INFO"]
    volumes:
      - superset_home:/app/superset_home
    networks:
      - analise_net

  # ---------------------------------------------------------------------------
  # Nginx — proxy reverso; única porta publicada do stack.
  # Valida autenticação via auth_request ao GTW antes de encaminhar ao Superset.
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.26-alpine
    ports:
      - "8088:80"
    volumes:
      # DEV: SSO desabilitado e usuário fixo; produção sobrescreve com default.conf
      - ./nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - superset
    networks:
      - analise_net

# =============================================================================
# Volumes nomeados (dados persistentes)
# =============================================================================
volumes:
  superset_home:
  postgres_data:
  redis_data:

# =============================================================================
# Rede interna — serviços se comunicam sem exposição ao host
# =============================================================================
networks:
  analise_net:
    driver: bridge
