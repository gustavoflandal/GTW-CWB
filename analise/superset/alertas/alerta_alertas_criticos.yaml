# Alerta: Alertas críticos pendentes (TR 5.4.3.5)
uuid: "a1000001-5007-4000-b001-000000000004"
name: "Alertas críticos sem tratamento"
description: >
  Dispara quando existem alertas com severidade crítica sem tratamento
  há mais de 2 horas.
type: alert
active: true
crontab: "*/10 * * * *"
timezone: "America/Bahia"

database: "GTW Muralha Digital (somente leitura)"
sql: >
  SELECT COUNT(*) AS valor
  FROM analise.v_alertas
  WHERE severidade = 'critico'
    AND status = 'pendente'
    AND dt_alerta <= DATEADD(HOUR, -2, GETDATE())

validator_type: operator
validator_config:
  op: ">"
  threshold: 0

owners: ["admin"]
recipients:
  - type: email
    target: "operacao@muralhadigital.local"
grace_period: 1800
log_retention: 90
