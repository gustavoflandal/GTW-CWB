# Painel: Disponibilidade de Equipamentos (TR 5.8.2)
uuid: "d2a00001-sup4-4000-b001-000000000004"
dashboard_title: "Disponibilidade de Equipamentos"
slug: disponibilidade-equipamentos
description: >
  Disponibilidade diaria dos equipamentos: verificacoes, percentual
  e periodos offline. Fonte: Plano 18.
published: true
tags: ["oficial", "operacional"]
refresh_frequency: 60

filters:
  - name: Periodo
    type: time_range
    required: true
    default: "Last 7 days"
    targets: ["__all__"]

  - name: Equipamento
    type: select
    dataset: v_disponibilidade_dia
    column: local_nome
    targets: ["__all__"]

charts:
  - name: "Disponibilidade Global (%)"
    viz_type: big_number_total
    dataset: v_disponibilidade_dia
    metric: pct_disponibilidade_global
    time_column: dia
    conditional_formatting:
      - operator: "<"
        value: 95
        color: "#FF4136"
        label: "Abaixo de 95%"
    width: 4
    height: 1

  - name: "Total de Verificacoes"
    viz_type: big_number_total
    dataset: v_disponibilidade_dia
    metric: total_verificacoes
    time_column: dia
    width: 4
    height: 1

  - name: "Verificacoes OK"
    viz_type: big_number_total
    dataset: v_disponibilidade_dia
    metric: total_verificacoes_ok
    time_column: dia
    width: 4
    height: 1

  - name: "Disponibilidade por Dia"
    viz_type: echarts_timeseries_line
    dataset: v_disponibilidade_dia
    metric: media_disponibilidade
    time_column: dia
    time_grain: P1D
    reference_lines:
      - value: 95
        label: "Meta (95%)"
        color: "#2ECC40"
        style: dashed
    width: 12
    height: 3

  - name: "Ranking de Equipamentos por Disponibilidade"
    viz_type: table
    dataset: v_disponibilidade_dia
    columns: ["local_nome"]
    metrics: ["media_disponibilidade", "total_verificacoes"]
    orderby: [["media_disponibilidade", "asc"]]
    row_limit: 20
    conditional_formatting:
      - column: media_disponibilidade
        operator: "<"
        value: 95
        color: "#FF4136"
    width: 12
    height: 3
