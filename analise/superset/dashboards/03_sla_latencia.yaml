# Painel: SLA de Latencia (TR 5.2.7)
uuid: "d2a00001-sup4-4000-b001-000000000003"
dashboard_title: "SLA de Latencia"
slug: sla-latencia
description: >
  Monitoramento do SLA de latencia: percentil 95 do tempo de
  resposta entre leitura e alerta na plataforma (maximo 4 segundos).
published: true
tags: ["oficial", "operacional"]
refresh_frequency: 60
certified_by: "Consilux / Edital Salvador"

filters:
  - name: Periodo
    type: time_range
    required: true
    default: "Last 7 days"
    targets: ["__all__"]

charts:
  - name: "SLA Cumprido (%)"
    viz_type: big_number_total
    dataset: v_sla_latencia_dia
    metric: pct_sla_cumprido
    time_column: dia
    conditional_formatting:
      - operator: "<"
        value: 95
        color: "#FF4136"
        label: "Abaixo da meta"
    width: 4
    height: 1

  - name: "Latencia P95 Media (ms)"
    viz_type: big_number_total
    dataset: v_sla_latencia_dia
    metric: media_p95
    time_column: dia
    width: 4
    height: 1

  - name: "Total de Violacoes"
    viz_type: big_number_total
    dataset: v_sla_latencia_dia
    metric: total_violacoes
    time_column: dia
    width: 4
    height: 1

  - name: "Evolucao do SLA (%)"
    viz_type: echarts_timeseries_line
    dataset: v_sla_latencia_dia
    metrics: ["pct_sla_cumprido"]
    time_column: dia
    time_grain: P1D
    reference_lines:
      - value: 95
        label: "Meta (95%)"
        color: "#2ECC40"
        style: dashed
    width: 6
    height: 3

  - name: "Latencia P95 por Dia (ms)"
    viz_type: echarts_timeseries_bar
    dataset: v_sla_latencia_dia
    metrics: ["media_p95"]
    time_column: dia
    time_grain: P1D
    reference_lines:
      - value: 4000
        label: "Limiar 4s"
        color: "#FF4136"
        style: dashed
    width: 6
    height: 3

  - name: "Janelas OK vs Violacao"
    viz_type: echarts_timeseries_bar
    dataset: v_sla_latencia_dia
    custom_metrics:
      - name: janelas_ok_sum
        label: "Janelas OK"
        expression: "SUM(janelas_ok)"
      - name: janelas_violacao_sum
        label: "Violacoes"
        expression: "SUM(janelas_violacao)"
    time_column: dia
    time_grain: P1D
    stack: true
    width: 12
    height: 2
