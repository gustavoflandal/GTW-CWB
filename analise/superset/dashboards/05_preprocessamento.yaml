# Painel: Pre-processamento de Imagens (TR 5.5.3)
uuid: "d2a00001-sup4-4000-b001-000000000005"
dashboard_title: "Pre-processamento de Imagens"
slug: preprocessamento-imagens
description: >
  Indicadores de pre-processamento conforme as 14 alineas do TR 5.5.3.1:
  recebidos, processados, aproveitamento, tempo medio, produtividade,
  divergencias, backlog e SLA 72h.
published: true
tags: ["oficial", "operacional"]
refresh_frequency: 30
certified_by: "Consilux / Edital Salvador"

filters:
  - name: Periodo
    type: time_range
    required: true
    default: "Last 7 days"
    targets: ["__all__"]

  - name: Equipamento
    type: select
    dataset: v_preprocessamento
    column: local_nome
    targets: ["__all__"]

  - name: Operador
    type: select
    dataset: v_preprocessamento
    column: operador
    targets: ["__all__"]

charts:
  - name: "Total Recebidos"
    viz_type: big_number_total
    dataset: v_preprocessamento
    metric: total_recebidos
    time_column: dia
    width: 3
    height: 1

  - name: "Total Pre-processados"
    viz_type: big_number_total
    dataset: v_preprocessamento
    metric: total_preprocessados
    time_column: dia
    width: 3
    height: 1

  - name: "Aproveitamento (%)"
    viz_type: big_number_total
    dataset: v_preprocessamento
    metric: aproveitamento_global
    time_column: dia
    width: 3
    height: 1

  - name: "SLA 72h (%)"
    viz_type: big_number_total
    dataset: v_preprocessamento
    metric: sla_72h_global
    time_column: dia
    conditional_formatting:
      - operator: "<"
        value: 90
        color: "#FF4136"
    width: 3
    height: 1

  - name: "Evolucao: Recebidos x Processados x Descartados"
    viz_type: echarts_timeseries_bar
    dataset: v_preprocessamento
    metrics: ["total_recebidos", "total_preprocessados", "total_descartados"]
    time_column: dia
    time_grain: P1D
    width: 6
    height: 3

  - name: "Tempo Medio de Analise (min)"
    viz_type: echarts_timeseries_line
    dataset: v_preprocessamento
    metric: tempo_medio_global
    time_column: dia
    time_grain: P1D
    width: 6
    height: 3

  - name: "Produtividade por Operador"
    viz_type: table
    dataset: v_preprocessamento
    columns: ["operador"]
    metrics: ["produtividade_media", "total_recebidos"]
    orderby: [["produtividade_media", "desc"]]
    row_limit: 20
    width: 6
    height: 3

  - name: "Backlog e Pendentes"
    viz_type: echarts_timeseries_bar
    dataset: v_preprocessamento
    metrics: ["total_pendentes", "total_backlog"]
    time_column: dia
    time_grain: P1D
    stack: true
    width: 6
    height: 3
