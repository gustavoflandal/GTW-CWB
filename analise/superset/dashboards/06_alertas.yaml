# Painel: Alertas por Tipo e Regiao
uuid: "d2a00001-5004-4000-b001-000000000006"
dashboard_title: "Alertas"
slug: alertas
description: >
  Visao geral dos alertas do sistema: total, criticos, pendentes,
  distribuicao por tipo e status, evolucao temporal.
published: true
tags: ["oficial", "operacional"]
refresh_frequency: 30

filters:
  - name: Periodo
    type: time_range
    required: true
    default: "Last 7 days"
    targets: ["__all__"]

  - name: Tipo
    type: select
    dataset: v_alertas
    column: tipo_descricao
    targets: ["__all__"]

  - name: Status
    type: select
    dataset: v_alertas
    column: status
    targets: ["__all__"]

charts:
  - name: "Total de Alertas"
    viz_type: big_number_total
    dataset: v_alertas
    metric: total_alertas
    time_column: dt_alerta
    width: 3
    height: 1

  - name: "Alertas Criticos"
    viz_type: big_number_total
    dataset: v_alertas
    metric: alertas_criticos
    time_column: dt_alerta
    width: 3
    height: 1

  - name: "Pendentes"
    viz_type: big_number_total
    dataset: v_alertas
    metric: alertas_pendentes
    time_column: dt_alerta
    width: 3
    height: 1

  - name: "% Tratados"
    viz_type: big_number_total
    dataset: v_alertas
    metric: pct_tratados
    time_column: dt_alerta
    width: 3
    height: 1

  - name: "Alertas por Tipo"
    viz_type: pie
    dataset: v_alertas
    metric: total_alertas
    groupby: ["tipo_descricao"]
    width: 6
    height: 3

  - name: "Evolucao de Alertas"
    viz_type: echarts_timeseries_bar
    dataset: v_alertas
    metric: total_alertas
    time_column: dt_alerta
    time_grain: P1D
    groupby: ["tipo_descricao"]
    stack: true
    width: 6
    height: 3

  - name: "Alertas por Status"
    viz_type: pie
    dataset: v_alertas
    metric: total_alertas
    groupby: ["status"]
    width: 6
    height: 2

  - name: "Top Responsaveis"
    viz_type: table
    dataset: v_alertas
    columns: ["usuario_responsavel"]
    metrics: ["total_alertas", "pct_tratados"]
    orderby: [["total_alertas", "desc"]]
    row_limit: 10
    width: 6
    height: 2
