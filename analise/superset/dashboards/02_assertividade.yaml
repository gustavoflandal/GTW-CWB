# Painel: Assertividade da Dupla Analise (TR 5.2.2.6)
uuid: "d2a00001-5004-4000-b001-000000000002"
dashboard_title: "Assertividade — Dupla Analise"
slug: assertividade-dupla-analise
description: >
  Taxa de concordancia entre analistas na dupla analise independente
  de infracoes. Destaque visual quando abaixo de 80% (limiar do TR).
published: true
tags: ["oficial", "operacional"]
refresh_frequency: 30
certified_by: "Consilux / Edital Salvador"

filters:
  - name: Periodo
    type: time_range
    required: true
    default: "Last 7 days"
    targets: ["__all__"]

charts:
  - name: "Assertividade Atual (%)"
    viz_type: big_number_total
    dataset: v_assertividade_dia
    metric: assertividade_media
    time_column: dia
    conditional_formatting:
      - operator: "<"
        value: 80
        color: "#FF4136"
        label: "Abaixo do limiar"
    width: 4
    height: 1

  - name: "Total Analisadas"
    viz_type: big_number_total
    dataset: v_assertividade_dia
    metric: total_analisadas_sum
    time_column: dia
    width: 4
    height: 1

  - name: "Total Desempates"
    viz_type: big_number_total
    dataset: v_assertividade_dia
    metric: total_desempates
    time_column: dia
    width: 4
    height: 1

  - name: "Evolucao da Assertividade"
    viz_type: echarts_timeseries_line
    dataset: v_assertividade_dia
    metrics: ["assertividade_media"]
    time_column: dia
    time_grain: P1D
    y_axis_format: ",.1f"
    reference_lines:
      - value: 80
        label: "Limiar TR (80%)"
        color: "#FF4136"
        style: dashed
    width: 12
    height: 3

  - name: "Distribuicao: Aprovadas x Reprovadas x Desempate"
    viz_type: echarts_timeseries_bar
    dataset: v_assertividade_dia
    metrics: ["pre_aprovadas_sum", "reprovadas_sum", "desempate_sum"]
    custom_metrics:
      - name: pre_aprovadas_sum
        label: "Pre-aprovadas"
        expression: "SUM(pre_aprovadas)"
      - name: reprovadas_sum
        label: "Reprovadas"
        expression: "SUM(reprovadas)"
      - name: desempate_sum
        label: "Desempates"
        expression: "SUM(desempate)"
    time_column: dia
    time_grain: P1D
    stack: true
    width: 12
    height: 3
