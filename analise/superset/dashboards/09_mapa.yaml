# Painel: Mapa de Equipamentos e Infracoes (deck.gl)
uuid: "d2a00001-sup4-4000-b001-000000000009"
dashboard_title: "Mapa — Equipamentos e Infracoes"
slug: mapa-equipamentos-infracoes
description: >
  Mapa interativo com camadas deck.gl: scatter de equipamentos,
  heatmap de infracoes e poligonos das areas monitoradas
  (GeoJSON da v_areas_monitoradas_geojson). Tiles OpenStreetMap.
published: true
tags: ["oficial", "operacional"]
refresh_frequency: 120

filters:
  - name: Periodo
    type: time_range
    required: true
    default: "Last 30 days"
    targets: ["__all__"]

  - name: Area Monitorada
    type: select
    dataset: v_equipamentos
    column: area_monitorada
    targets: ["__all__"]

charts:
  - name: "Equipamentos (Scatter)"
    viz_type: deck_scatter
    dataset: v_equipamentos
    spatial:
      lat: lat
      lon: lon
    point_radius: 300
    color_column: ativo_24h
    color_scheme:
      "0": "#FF4136"
      "1": "#2ECC40"
    tooltip: ["nome", "tipo", "area_monitorada", "ativo_24h"]
    width: 12
    height: 4

  - name: "Infracoes (Heatmap)"
    viz_type: deck_screengrid
    dataset: mat_infracoes_dia
    spatial:
      lat: lat
      lon: lon
    size_metric: total_infracoes
    time_column: dia
    width: 12
    height: 4

  - name: "Areas Monitoradas (Poligonos)"
    viz_type: deck_polygon
    dataset: v_areas_monitoradas_geojson
    geojson_column: dados_json
    fill_color: [0, 119, 191, 80]
    stroke_color: [0, 119, 191, 200]
    tooltip: ["nome"]
    width: 12
    height: 4

  - name: "Equipamentos com Mais Infracoes"
    viz_type: table
    dataset: mat_infracoes_dia
    columns: ["local_nome"]
    metrics: ["total_infracoes", "excesso_medio_ponderado"]
    orderby: [["total_infracoes", "desc"]]
    row_limit: 15
    width: 12
    height: 3
