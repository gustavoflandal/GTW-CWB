<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 300">
  <rect width="450" height="300" rx="16" fill="#f0f7fc"/>
  <!-- Gauge arc background -->
  <path d="M 115 210 A 120 120 0 0 1 335 210" fill="none" stroke="#dde8f0" stroke-width="28" stroke-linecap="round"/>
  <!-- Gauge arc filled -->
  <path d="M 115 210 A 120 120 0 0 1 300 100" fill="none" stroke="#0d75bf" stroke-width="28" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="225" cy="210" r="14" fill="#0d75bf"/>
  <circle cx="225" cy="210" r="7" fill="#f0f7fc"/>
  <!-- Needle -->
  <line x1="225" y1="210" x2="290" y2="115" stroke="#0d75bf" stroke-width="6" stroke-linecap="round"/>
  <!-- Value text -->
  <text x="225" y="260" text-anchor="middle" fill="#0d75bf" font-family="Arial,sans-serif" font-size="36" font-weight="bold">KPI</text>
</svg>
