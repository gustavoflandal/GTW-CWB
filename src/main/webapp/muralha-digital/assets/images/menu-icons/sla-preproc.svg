<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 300">
  <rect width="450" height="300" fill="white"/>
  <rect x="6" y="6" width="438" height="288" rx="10" fill="none" stroke="#c5dff0" stroke-width="2"/>
  <!-- Hourglass frame top -->
  <line x1="140" y1="40" x2="260" y2="40" stroke="#2c3e50" stroke-width="6" stroke-linecap="round"/>
  <!-- Hourglass frame bottom -->
  <line x1="140" y1="250" x2="260" y2="250" stroke="#2c3e50" stroke-width="6" stroke-linecap="round"/>
  <!-- Hourglass body -->
  <path d="M 150 45 L 150 100 Q 150 145 200 145 Q 250 145 250 100 L 250 45" fill="none" stroke="#2c3e50" stroke-width="5" stroke-linejoin="round"/>
  <path d="M 150 245 L 150 190 Q 150 145 200 145 Q 250 145 250 190 L 250 245" fill="none" stroke="#2c3e50" stroke-width="5" stroke-linejoin="round"/>
  <!-- Sand top -->
  <path d="M 165 60 L 235 60 L 210 110 L 190 110 Z" fill="#85c1e9"/>
  <!-- Sand bottom -->
  <path d="M 175 215 L 225 215 L 240 240 L 160 240 Z" fill="#1a78b0"/>
  <!-- Falling sand -->
  <line x1="200" y1="145" x2="200" y2="200" stroke="#1a78b0" stroke-width="3"/>
  <!-- 72h badge -->
  <rect x="290" y="170" width="75" height="60" rx="14" fill="#1a78b0" stroke="#2c3e50" stroke-width="3.5"/>
  <text x="327" y="210" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">72h</text>
</svg>