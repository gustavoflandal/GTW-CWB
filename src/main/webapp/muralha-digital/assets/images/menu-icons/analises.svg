<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 300">
  <rect width="450" height="300" fill="white"/>
  <rect x="6" y="6" width="438" height="288" rx="10" fill="none" stroke="#c5dff0" stroke-width="2"/>
  <!-- Bar chart -->
  <rect x="85" y="185" width="35" height="55" rx="4" fill="#1a78b0" stroke="#2c3e50" stroke-width="2"/>
  <rect x="135" y="145" width="35" height="95" rx="4" fill="#1a78b0" stroke="#2c3e50" stroke-width="2"/>
  <rect x="185" y="105" width="35" height="135" rx="4" fill="#1a78b0" stroke="#2c3e50" stroke-width="2"/>
  <rect x="235" y="130" width="35" height="110" rx="4" fill="#27ae60" stroke="#2c3e50" stroke-width="2"/>
  <!-- Chart axis -->
  <line x1="70" y1="240" x2="285" y2="240" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
  <line x1="70" y1="80" x2="70" y2="240" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
  <!-- Trend line going up -->
  <polyline points="100,210 150,175 200,130 250,155" fill="none" stroke="#e74c3c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8,4"/>
  <!-- Magnifying glass over chart -->
  <circle cx="340" cy="120" r="40" fill="none" stroke="#2c3e50" stroke-width="5"/>
  <line x1="370" y1="148" x2="395" y2="173" stroke="#2c3e50" stroke-width="6" stroke-linecap="round"/>
  <!-- Mini pie inside magnifier -->
  <path d="M 340 95 L 340 120 L 360 105 Z" fill="#1a78b0"/>
  <path d="M 340 120 L 360 105 A 25 25 0 0 1 365 120 Z" fill="#27ae60"/>
  <path d="M 340 120 L 365 120 A 25 25 0 0 1 355 140 Z" fill="#e74c3c"/>
  <path d="M 340 120 L 355 140 A 25 25 0 0 1 315 120 L 340 120 Z" fill="#f39c12" opacity="0.7"/>
  <path d="M 340 120 L 315 120 A 25 25 0 0 1 340 95 Z" fill="#1a78b0" opacity="0.5"/>
  <!-- BI label -->
  <text x="345" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#2c3e50">BI</text>
  <text x="345" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1a78b0">Analytics</text>
</svg>
