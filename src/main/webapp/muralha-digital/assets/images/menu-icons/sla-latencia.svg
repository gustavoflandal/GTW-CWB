  <!-- Minute hand -->
  <line x1="200" y1="140" x2="240" y2="112" stroke="#1a78b0" stroke-width="4" stroke-linecap="round"/>
  <!-- Speed badge -->
  <rect x="295" y="175" width="65" height="65" rx="15" fill="#1a78b0" stroke="#2c3e50" stroke-width="3.5"/>
  <path d="M 310 218 A 22 22 0 1 1 350 218" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="330" y1="208" x2="340" y2="196" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <circle cx="330" cy="208" r="2.5" fill="white"/>
