  <rect x="205" y="58" width="95" height="50" rx="4" fill="none" stroke="#85c1e9" stroke-width="2.5"/>
  <polyline points="218,95 235,82 255,90 275,76 290,80" fill="none" stroke="#1a78b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
