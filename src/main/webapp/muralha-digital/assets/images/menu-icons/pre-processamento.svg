<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 300">
  <rect width="450" height="300" fill="white"/>
  <rect x="6" y="6" width="438" height="288" rx="10" fill="none" stroke="#c5dff0" stroke-width="2"/>
  <!-- Dashboard panel -->
  <rect x="120" y="50" width="210" height="130" rx="10" fill="none" stroke="#2c3e50" stroke-width="5"/>
  <!-- KPI cards inside -->
  <rect x="135" y="65" width="55" height="40" rx="5" fill="#1a78b0" opacity="0.2" stroke="#1a78b0" stroke-width="2"/>
  <rect x="200" y="65" width="55" height="40" rx="5" fill="#27ae60" opacity="0.2" stroke="#27ae60" stroke-width="2"/>
  <rect x="265" y="65" width="55" height="40" rx="5" fill="#e74c3c" opacity="0.2" stroke="#e74c3c" stroke-width="2"/>
  <!-- Line chart inside panel -->
  <polyline points="140,150 170,135 200,145 230,120 260,130 290,110 315,125" fill="none" stroke="#1a78b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Gauge / SLA indicator -->
  <path d="M 340 200 A 45 45 0 1 1 420 200" fill="none" stroke="#2c3e50" stroke-width="5" stroke-linecap="round"/>
  <line x1="380" y1="200" x2="395" y2="170" stroke="#e74c3c" stroke-width="4" stroke-linecap="round"/>
  <circle cx="380" cy="200" r="5" fill="#2c3e50"/>
  <!-- Checkmark badge -->
  <rect x="120" y="200" width="65" height="65" rx="15" fill="#27ae60" stroke="#2c3e50" stroke-width="3.5"/>
  <polyline points="135,235 148,250 170,220" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Progress bars -->
  <rect x="205" y="210" width="100" height="12" rx="6" fill="#e8e8e8"/>
  <rect x="205" y="210" width="75" height="12" rx="6" fill="#1a78b0"/>
  <rect x="205" y="235" width="100" height="12" rx="6" fill="#e8e8e8"/>
  <rect x="205" y="235" width="90" height="12" rx="6" fill="#27ae60"/>
  <rect x="205" y="260" width="100" height="12" rx="6" fill="#e8e8e8"/>
  <rect x="205" y="260" width="40" height="12" rx="6" fill="#e74c3c"/>
</svg>
